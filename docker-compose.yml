services:
  postgres:
    image: postgres:16-alpine
    container_name: reconcile-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: reconcile_ai
      POSTGRES_USER: reconcile_user
      POSTGRES_PASSWORD: reconcile_password

    ports:
      - "5432:5432"

    volumes:
      - reconcile_ai_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile_user -d reconcile_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  reconcile_ai_postgres_data:

